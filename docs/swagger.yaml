      description: |
        Items MADE_TO_ORDER sem Purchase de Sales não canceladas/excluídas, agrupados por Supplier
        (por nome); o grupo sem Supplier (supplier_id null) vem por último.
      responses:
        "200":
          description: Grupos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSaleItemGroup"
