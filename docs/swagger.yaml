  # ============================================================
  # Vendas
  # ============================================================
  /api/v1/vendas:
    get:
      tags:
        - Vendas
      summary: Lista vendas com totais calculados
      description: |
        Retorna vendas a partir da view `vw_vendas_resumo` com totais já calculados.
        Suporta múltiplos filtros opcionais.
      operationId: listVendas
      parameters:
        - name: delivery_status
          in: query
          schema:
            type: string
          description: "SaleDeliveryStatus; aceita vários separados por vírgula (ex.: TO_DELIVER,DELIVERED)"
        - name: payment_status
          in: query
          schema:
            type: string
          description: "SalePaymentStatus; aceita vários separados por vírgula (ex.: PENDING,PARTIAL)"
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
          description: "Data inicial da venda (formato: YYYY-MM-DD)"
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
          description: "Data final da venda (formato: YYYY-MM-DD)"
        - name: cliente_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filtra por cliente
        - name: pendente
          in: query
          schema:
            type: boolean
          description: "Se `true`, retorna apenas vendas com saldo a receber"
        - name: freight_pending
          in: query
          schema:
            type: boolean
          description: "Se `true`, só Sales com frete_valor > frete_pago, exceto CANCELED (AYD-004)"
        - name: commission_pending
          in: query
          schema:
            type: boolean
          description: "Se `true`, só Sales com comissao_valor > 0 e comissao_paga = false, exceto CANCELED (AYD-004)"
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "data_venda >= from (inclusivo, YYYY-MM-DD; 400 se inválida)"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "data_venda <= to (inclusivo, YYYY-MM-DD; 400 se inválida)"
      responses:
        "200":
          description: Lista de vendas ordenada por data_venda DESC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendaListResponse"
        "400":
          description: "Parâmetro inválido (ex: cliente_id não é UUID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vendas/{id}:
    parameters:
      - name: id
        in: path
