  # ============================================================
  # Vendas
  # ============================================================
  /api/v1/vendas:
    get:
      tags:
        - Vendas
      summary: Lista vendas com totais calculados
      description: |
        Retorna vendas a partir da view `vw_vendas_resumo` com totais já calculados.
        Suporta múltiplos filtros opcionais.
      operationId: listVendas
      parameters:
        - name: delivery_status
          in: query
          schema:
            type: string
          description: "SaleDeliveryStatus; aceita vários separados por vírgula (ex.: TO_DELIVER,DELIVERED)"
        - name: payment_status
          in: query
          schema:
            type: string
          description: "SalePaymentStatus; aceita vários separados por vírgula (ex.: PENDING,PARTIAL)"
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
          description: "Data inicial da venda (formato: YYYY-MM-DD)"
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
          description: "Data final da venda (formato: YYYY-MM-DD)"
        - name: cliente_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filtra por cliente
        - name: pendente
          in: query
          schema:
            type: boolean
          description: "Se `true`, retorna apenas vendas com saldo a receber"
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "data_venda >= from (inclusivo, YYYY-MM-DD; 400 se inválida)"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "data_venda <= to (inclusivo, YYYY-MM-DD; 400 se inválida)"
        - name: q
          in: query
          schema:
            type: string
          description: "AYD-011 C4: nome do cliente, número da Sale (exato, se numérico) ou nome de Item (contém, sem acento nem caixa)"
        - name: referrer_id
          in: query
          schema:
            type: string
            format: uuid
          description: "AYD-011 C4: Sales indicadas pelo Partner (400 se inválido)"
      responses:
        "200":
          description: Lista de vendas ordenada por data_venda DESC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendaListResponse"
        "400":
          description: "Parâmetro inválido (ex: cliente_id não é UUID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vendas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Vendas
      summary: Busca uma venda por ID com itens
      operationId: getVenda
      responses:
        "200":
          description: Detalhe completo da venda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendaDetailResponse"
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Vendas
      summary: Atualiza uma venda
      description: |
        Atualiza campos editáveis da venda.
        **Campos imutáveis**: `cliente_id` e `data_venda`.
      operationId: updateVenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendaUpdateRequest"
      responses:
        "200":
          description: Venda atualizada (retorna detalhe completo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendaDetailResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Vendas
      summary: Remove uma venda (soft delete)
      operationId: deleteVenda
      responses:
        "204":
          description: Venda removida com sucesso
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- Itens de Venda ---
  /api/v1/vendas/{id}/delivery-status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Vendas
      summary: Altera o status de entrega da Sale
      operationId: updateDeliveryStatus
      description: |
        Cancelar (CANCELED) só se nenhum Item estiver em Purchase ORDERED/RECEIVED; Items em Purchase OPEN
        são liberados na mesma transação. CANCELED é terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStatusRequest"
      responses:
        "200":
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStatusResponse"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale já CANCELED ou com Item em Purchase ORDERED/RECEIVED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/vendas/{id}/itens:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Vendas / Itens
      summary: Lista os itens de uma venda
      operationId: listItensVenda
      responses:
        "200":
          description: Lista de itens da venda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemVendaResponse"
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Vendas / Itens
      summary: Adiciona um item a uma venda
      operationId: createItemVenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVendaRequest"
      responses:
        "201":
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemVendaMutationResponse"
        "400":
          description: Dados inválidos (produto_nome, quantidade > 0, preços >= 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED, ou Item em Purchase (OPEN: remova-o antes; ORDERED/RECEIVED: origin/fornecedor_id/quantidade/custo_unit travados; DELETE sempre 409)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vendas/{id}/itens/fulfillment:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Vendas / Itens
      summary: Atendimento em lote dos Items da Sale (AYD-011 C6)
      operationId: batchFulfillment
      description: |
        Aplica origem e fornecedor a 1..50 Items com as mesmas regras do PUT por Item, numa transação
        (tudo ou nada). Custo do FROM_STOCK pela regra RN-16.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchFulfillmentRequest"
      responses:
        "200":
          description: Items atualizados (ordem do pedido) e avisos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchFulfillmentResponse"
        "400":
          description: "Lote fora de 1..50, id repetido, origem inválida, Item de outra Sale, Item SERVICE, FROM_STOCK sem Product (com `item_id` quando aponta um Item)"
        "404":
          description: Venda não encontrada
        "409":
          description: "Sale cancelada ou Item travado em Purchase (`{ error, item_id }`)"
        "401":
          description: Não autenticado

  /api/v1/vendas/{id}/itens/{itemId}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        description: UUID do item
        schema:
          type: string
          format: uuid

    put:
      tags:
        - Vendas / Itens
      summary: Atualiza um item de venda
      operationId: updateItemVenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVendaRequest"
      responses:
        "200":
          description: Item atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemVendaMutationResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED, ou Item em Purchase (OPEN: remova-o antes; ORDERED/RECEIVED: origin/fornecedor_id/quantidade/custo_unit travados; DELETE sempre 409)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Item ou venda não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Vendas / Itens
      summary: Remove um item de venda
      description: |
        Remove um item da venda.
        **Regra:** A venda deve manter ao menos 1 item.
        Retorna 400 se a venda tiver somente 1 item.
      operationId: deleteItemVenda
      responses:
        "204":
          description: Item removido com sucesso
        "400":
          description: UUID inválido ou tentativa de remover o último item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED, ou Item em Purchase (OPEN: remova-o antes; ORDERED/RECEIVED: origin/fornecedor_id/quantidade/custo_unit travados; DELETE sempre 409)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Item não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Contas e movimentações (AYD-007 / SPEC-008)
  # ============================================================
  /api/v1/obligations:
    get:
      tags:
        - Contas
      summary: Lista contas a pagar e a receber
      description: "Mais próximas do vencimento primeiro. `totals` cobre o conjunto filtrado (não só a página)."
      operationId: listObligations
      parameters:
        - { name: direction, in: query, schema: { $ref: "#/components/schemas/ObligationDirection" } }
        - { name: status, in: query, description: "Um ou mais (CSV): OPEN,PARTIAL", schema: { type: string } }
        - { name: counterparty_type, in: query, schema: { type: string, enum: [SUPPLIER, PARTNER, CUSTOMER] } }
        - { name: counterparty_id, in: query, schema: { type: string, format: uuid } }
        - { name: origin_type, in: query, schema: { type: string, enum: [SALE, PURCHASE] } }
        - { name: origin_id, in: query, schema: { type: string, format: uuid } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: due_to, in: query, description: "Vencimento (próxima parcela, ou prazo da conta) até esta data", schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Contas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Obligation" }
                  totals:
                    type: object
                    properties:
                      amount: { type: number, format: double }
                      settled: { type: number, format: double }
                      open: { type: number, format: double }
                  total: { type: integer }
                  offset: { type: integer }
                  has_more: { type: boolean }
        "400":
          description: Filtro inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/obligations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags:
        - Contas
      summary: Detalhe da conta (componentes, parcelas e quitações)
      operationId: getObligation
      responses:
        "200":
          description: Conta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationDetail" }
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado
    patch:
      tags:
        - Contas
      summary: Altera o prazo final e as notas da conta
      description: "Só `due_date` e `notes` (null limpa); valor, quitado e status são calculados."
      operationId: patchObligation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                due_date: { type: string, format: date, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationDetail" }
        "400":
          description: Data inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/obligations/{id}/installments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags:
        - Contas
      summary: Substitui o plano de parcelas da conta
      operationId: putInstallments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallmentsRequest" }
      responses:
        "200":
          description: Conta com o novo plano
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationDetail" }
        "400":
          description: "Parcela inválida ou Σ parcelas > valor da conta"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/obligations/{id}/installments/generate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags:
        - Contas
      summary: Gera parcelas iguais (centavos na última) e substitui o plano
      operationId: generateInstallments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallmentsGenerateRequest" }
      responses:
        "200":
          description: Conta com o novo plano
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationDetail" }
        "400":
          description: "count fora de 2..24, datas ou valor inválidos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/obligations/{id}/settle:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags:
        - Contas
      summary: Paga ou recebe uma conta (atalho de POST /settlements com 1 conta)
      operationId: settleObligation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movement]
              properties:
                amount: { type: number, format: double, description: "Padrão: o aberto da conta" }
                movement:
                  $ref: "#/components/schemas/SettleRequest/properties/movement"
      responses:
        "201":
          description: Quitação registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettleResponse" }
        "400":
          description: "Valor/forma/categoria inválidos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Conta não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "valor acima do devido; venda cancelada: recebimentos bloqueados"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/settlements:
    post:
      tags:
        - Contas
      summary: Paga ou recebe — uma movimentação, N contas
      description: |
        Um Pix pode quitar várias contas (todas na mesma direção). Contas de credores diferentes são
        permitidas: responde **201** com `warnings: ["MIXED_COUNTERPARTIES"]`.
      operationId: createSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleRequest" }
      responses:
        "201":
          description: Movimentação (criada ou usada) e contas quitadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettleResponse" }
        "400":
          description: "allocations vazio; amount ≤ 0; direções diferentes; sem movement/movement_id; sinal incoerente"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Conta ou movimentação não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "valor acima do devido; Σ acima do valor da movimentação; venda cancelada: recebimentos bloqueados"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/settlements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags:
        - Contas
      summary: Desfaz a quitação (a movimentação permanece)
      operationId: deleteSettlement
      responses:
        "204":
          description: Desfeita (soft-delete)
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/financial-movements:
    get:
      tags:
        - Movimentações
      summary: Lista movimentações financeiras (dinheiro executado)
      description: "Mais recentes primeiro. `totals.outflow` é positivo; `net = inflow − outflow`."
      operationId: listFinancialMovements
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/MovementCategory" } }
        - { name: direction, in: query, schema: { type: string, enum: [IN, OUT] } }
        - { name: counterparty_type, in: query, schema: { type: string, enum: [SUPPLIER, PARTNER, CUSTOMER] } }
        - { name: counterparty_id, in: query, schema: { type: string, format: uuid } }
        - { name: unallocated_only, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Movimentações
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FinancialMovement" }
                  totals:
                    type: object
                    properties:
                      inflow: { type: number, format: double }
                      outflow: { type: number, format: double }
                      net: { type: number, format: double }
                  total: { type: integer }
                  offset: { type: integer }
                  has_more: { type: boolean }
        "400":
          description: Filtro inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado
    post:
      tags:
        - Movimentações
      summary: Lança uma movimentação avulsa (despesa ou OTHER_INCOME)
      operationId: createFinancialMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMovementRequest" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMovement" }
        "400":
          description: "amount = 0; sinal incoerente com a categoria; data/forma/categoria inválidas"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  /api/v1/financial-movements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags:
        - Movimentações
      summary: Correção da movimentação (carimba corrected_at)
      description: "Corpo igual ao do POST (substituição completa)."
      operationId: updateFinancialMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMovementRequest" }
      responses:
        "200":
          description: Corrigida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMovement" }
        "400":
          description: Payload inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "A correção deixaria Σ quitações > |amount| ou inverteria o sinal de uma movimentação que quita contas"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado
    delete:
      tags:
        - Movimentações
      summary: Anula a movimentação e desfaz as suas quitações
      operationId: deleteFinancialMovement
      responses:
        "204":
          description: Anulada (soft-delete da movimentação e das quitações)
        "404":
          description: Não encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Não autenticado

  # ============================================================
  # Purchases / Stock (AYD-002)
  # ============================================================
  /api/v1/purchases:
    get:
      tags:
        - Purchases
      summary: Lista Purchases (sem linhas)
      operationId: listPurchases
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/PurchaseKind"
          description: "Tipo"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PurchaseStatus"
          description: "Status"
        - name: payment_status
          in: query
          schema:
            $ref: "#/components/schemas/SupplierPaymentStatus"
          description: "Pagamento ao Supplier"
        - name: supplier_id
          in: query
          schema:
            type: string
            format: uuid
          description: "Supplier"
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "Data de criação ≥ (fuso America/Sao_Paulo)"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "Data de criação ≤"
        - name: open_only
          in: query
          schema:
            type: boolean
          description: "true = só compras com valor em aberto (open > 0) — AYD-008"
        - name: overdue
          in: query
          schema:
            type: boolean
          description: "true = só compras com alguma conta vencida — AYD-008"
      responses:
        "200":
          description: Purchases não excluídas, created_at desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseSummary"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    post:
      tags:
        - Purchases
      summary: Cria Purchase OPEN
      operationId: createPurchase
      description: |
        MADE_TO_ORDER: anexa `sale_item_ids` (mesmas regras de POST /purchases/{id}/sale-items).
        STOCK_REPLENISHMENT: cria as `items` (linhas de reposição).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCreateRequest"
      responses:
        "201":
          description: Purchase criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "400":
          description: "Payload inválido, fornecedor/produto inexistente, ou lista do outro tipo não vazia"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Item de Sale inexistente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Item de outro Supplier, já em outra Purchase, FROM_STOCK ou de Sale cancelada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

