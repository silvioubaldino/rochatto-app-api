  # ============================================================
  # Vendedores Externos
  # ============================================================
  # ============================================================
  # Partners (AYD-003) — substitui /vendedores-externos
  # ============================================================
  /api/v1/partners:
    get:
      tags:
        - Partners
      summary: Lista Partners (ordem por nome)
      operationId: listPartners
      parameters:
        - name: q
          in: query
          description: Busca por nome (ILIKE)
          schema:
            type: string
        - name: type
          in: query
