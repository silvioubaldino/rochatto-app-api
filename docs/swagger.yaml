      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Vendas]
      summary: Cobranças adicionais ao cliente
      operationId: listSaleCharges
      responses:
        "200":
          description: Cobranças não excluídas
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SaleCharge" } }
        "404": { description: Venda não encontrada }
    post:
      tags: [Vendas]
      summary: Lança cobrança adicional (frete cobrado, outras)
      operationId: createSaleCharge
      description: "Body `{kind: FREIGHT|OTHER, amount > 0, description?}`. 400 amount ≤ 0 / kind inválido · 404 venda · 409 venda CANCELED. 201 com `warnings` (OVERSETTLED)."
      responses:
        "201":
          description: Cobrança criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleCharge" }
  /api/v1/vendas/{id}/charges/{chargeId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: chargeId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Vendas]
      summary: Substitui a cobrança
      operationId: updateSaleCharge
      responses:
        "200": { description: Cobrança atualizada (com `warnings`) }
        "404": { description: Venda ou cobrança não encontrada }
        "409": { description: Venda CANCELED }
    delete:
      tags: [Vendas]
      summary: Exclui a cobrança (soft-delete)
      operationId: deleteSaleCharge
      responses:
        "204": { description: Excluída }
        "404": { description: Venda ou cobrança não encontrada }
        "409": { description: Venda CANCELED }
  /api/v1/vendas/{id}/costs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Vendas]
      summary: Custos da venda
      operationId: listSaleCosts
      responses:
        "200":
          description: Custos não excluídos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SaleCost" } }
        "404": { description: Venda não encontrada }
    post:
      tags: [Vendas]
      summary: Lança custo da venda (frete pago, instalador, comissão, outro)
      operationId: createSaleCost
      description: |
        Body `{kind, amount >= 0, description?, payee_supplier_id? | payee_partner_id?, sale_item_id?}`.
        COMMISSION → credor Partner (ausente = Partner indicador da Sale); FREIGHT/LABOR/OTHER → credor
        Supplier; null explícito = a definir. Aceita venda CANCELED. 400 amount < 0, credor de tipo
        incompatível ou ambos os credores · 404 credor ou venda. 201 com `warnings` (OVERSETTLED).
      responses:
        "201":
          description: Custo criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleCost" }
  /api/v1/vendas/{id}/costs/{costId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: costId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Vendas]
      summary: Substitui o custo (valor previsto, credor…)
      operationId: updateSaleCost
      responses:
        "200": { description: Custo atualizado (com `warnings`) }
        "404": { description: Venda, custo ou credor não encontrado }
    delete:
      tags: [Vendas]
      summary: Exclui o custo (soft-delete)
      operationId: deleteSaleCost
      responses:
        "204": { description: Excluído }
        "404": { description: Venda ou custo não encontrado }
  /api/v1/purchases/{id}/charges:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Purchases
      summary: Custos adicionais da compra
      operationId: listPurchaseCharges
      responses:
        "200":
          description: Custos adicionais (não excluídos)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseCharge"
        "404":
          description: Compra não encontrada
    post:
      tags:
        - Purchases
      summary: Lança custo adicional (frete de compra, descarga, imposto, outros)
      operationId: createPurchaseCharge
      description: |
        Qualquer status da compra. Credor: `payee_supplier_id` (ausente = fornecedor da compra;
        null = a definir). O custo entra na conta do credor (AYD-007) e é rateado entre as linhas.
        400 amount ≤ 0 / kind inválido · 404 compra ou fornecedor · 409 compra excluída ·
        422 BY_QUANTITY com unidades diferentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseChargeRequest"
      responses:
        "201":
          description: Custo lançado (+ warnings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseChargeMutation"
        "400":
          description: Payload inválido
        "404":
          description: Compra ou fornecedor não encontrado
        "409":
          description: Compra excluída
        "422":
          description: BY_QUANTITY com unidades diferentes — use rateio por valor

  /api/v1/purchases/{id}/charges/{chargeId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Purchases
      summary: Substitui um custo adicional
      operationId: updatePurchaseCharge
      description: "200 com warnings (OVERSETTLED se uma conta ficou com quitado > devido)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseChargeRequest"
      responses:
        "200":
          description: Custo atualizado (+ warnings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseChargeMutation"
        "400":
          description: Payload inválido
        "404":
          description: Não encontrado
        "409":
          description: Compra excluída
        "422":
          description: BY_QUANTITY com unidades diferentes
    delete:
      tags:
        - Purchases
      summary: Exclui (soft-delete) um custo adicional
      operationId: deletePurchaseCharge
      description: "O OVERSETTLED eventual aparece em GET /purchases/{id}.warnings."
      responses:
        "204":
          description: Excluído
        "404":
          description: Não encontrado
        "409":
          description: Compra excluída

  /api/v1/purchases/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Purchases
      summary: Transição de status
      operationId: updatePurchaseStatus
      description: |
        Só OPEN→ORDERED (carimba ordered_at), ORDERED→OPEN (limpa ordered_at) e ORDERED→RECEIVED
        (carimba received_at). RECEIVED é terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseStatusRequest"
      responses:
        "200":
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseStatusResponse"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Transição ilegal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Purchase sem linhas ao ir para ORDERED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/stock/balance:
    get:
      tags:
        - Stock
      summary: Balance por Product
      operationId: listStockBalance
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: "Trecho do nome do Product"
        - name: only_negative
          in: query
          schema:
            type: boolean
          description: "Se true, só Balance < 0"
      responses:
        "200":
          description: Products não excluídos, por nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockBalance"
        "401":
          description: Não autenticado

  /api/v1/stock/balance/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Stock
      summary: Balance + extrato do Product
      operationId: getStockBalance
      responses:
        "200":
          description: Balance e movimentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBalanceDetail"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/stock/adjustments:
    get:
      tags:
        - Stock
      summary: Lista ajustes
      operationId: listStockAdjustments
      parameters:
        - name: product_id
          in: query
          schema:
            type: string
            format: uuid
          description: "Filtra por Product"
      responses:
        "200":
          description: adjusted_at desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAdjustment"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    post:
      tags:
        - Stock
      summary: Cria ajuste manual (imutável)
      operationId: createStockAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentRequest"
      responses:
        "201":
          description: Ajuste criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustment"
        "400":
          description: "quantity = 0, reason inválido, produto inexistente ou data inválida"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/dashboard/kpis:
    get:
      tags:
        - Dashboard
      summary: KPIs do período e saldos em aberto (AYD-005)
      description: |
        KPIs do dashboard: Sales do período (com ticket médio), conversão Quote → Sale por coorte
        de Quote (venda rápida fica de fora), saldos em aberto de hoje e Sales a entregar.
        `sales` e `balances` usam o mesmo código de `/finance/summary` e nunca divergem.
        Período default: 1º dia do mês corrente até hoje (America/Sao_Paulo).
      operationId: getDashboardKpis
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "Início inclusivo (padrão: primeiro dia do mês corrente)"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "Fim inclusivo (padrão: hoje)"
      responses:
        "200":
          description: KPIs do período
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpisResponse"
        "400":
          description: Data inválida ou `from` > `to`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/resumo:
    get:
      tags:
        - Dashboard
      deprecated: true
      summary: "[DEPRECATED] Resumo financeiro do período"
      description: |
        **Deprecated (AYD-005):** use `GET /dashboard/kpis` (e `GET /finance/summary`). Mantido sem mudanças.

        Retorna indicadores financeiros consolidados.
        Por padrão, o período é o mês corrente.
        `total_a_receber` e `vendas_abertas` ignoram o filtro de período (refletem o total global de não-ENTREGUE).
      operationId: getDashboardResumo
      parameters:
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
          description: "Início do período (padrão: primeiro dia do mês atual)"
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
          description: "Fim do período (padrão: hoje)"
      responses:
        "200":
          description: Resumo financeiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumoResponse"
        "400":
          description: Data inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/finance/summary:
    get:
      tags:
        - Financeiro
      summary: Painel financeiro (entra × sai) de um período
      description: |
        AYD-004 / AYD-007 §6. `sales` = visão por competência (Sales com `data_venda` no período, não CANCELED);
        `cash` = dinheiro executado no período (movimentações); `expenses` = movimentações sem quitação de
        categoria de despesa; `result` = lucro das Sales − despesas (RN-17); `balances` = Σ open das contas
        hoje (ignoram o período). Default: do 1º dia do mês corrente até hoje.
      operationId: getFinanceSummary
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Painel financeiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummaryResponse"
        "400":
          description: "Data inválida ou from > to"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/notificacoes:
    get:
      tags:
        - Dashboard
      summary: Lista notificações não lidas
      description: |
        Retorna até 50 notificações não lidas. Vencidos aparecem primeiro. Alertas por parcela não coberta ou
        prazo de conta (janela de 5 dias): a receber → `pagamento_vencendo`/`pagamento_vencido`; a pagar →
        `conta_pagar_vencendo`/`conta_pagar_vencida` (AYD-007 §6).
        Antes de ler, a API executa `gerar_notificacoes_pagamentos()` (idempotente; preserva
        `lida`) — sem `pg_cron` (AYD-004). Se a geração falhar, responde 500.
      operationId: getNotificacoes
      parameters:
        - name: only_unread
          in: query
          required: false
          description: "`false` inclui os alertas já lidos (SPEC-006). Padrão: só os não lidos."
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Lista de notificações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificacoesListResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/notificacoes/{id}/lida:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da notificação
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Dashboard
      summary: Marca uma notificação como lida
      operationId: marcarNotificacaoLida
      responses:
        "204":
          description: Notificação marcada como lida
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Notificação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/notificacoes/marcar-todas-lidas:
    post:
      tags:
        - Dashboard
      summary: Marca todas as notificações como lidas
      operationId: marcarTodasNotificacoesLidas
      responses:
        "204":
          description: Todas as notificações marcadas como lidas
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/gerar-notificacoes:
    post:
      tags:
        - Dashboard
      summary: Dispara a geração de notificações de pagamentos
      description: |
        Executa a função PostgreSQL `gerar_notificacoes_pagamentos()`.
        Já é executada a cada `GET /dashboard/notificacoes` (AYD-004); este endpoint só dispara a
        mesma geração sob demanda. A função é versionada na migração 007.
      operationId: gerarNotificacoes
      responses:
        "204":
          description: Notificações geradas com sucesso
        "401":
          description: Não autenticado
        "500":
          description: Erro ao executar função
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Relatórios
  # ============================================================
  /api/v1/relatorios/vendas:
    get:
      tags:
        - Relatórios
      summary: Vendas e lucro por mês
      description: |
        Retorna EXATAMENTE N itens, do mês (corrente − N + 1) ao mês corrente (America/Sao_Paulo),
        em ordem crescente; meses sem Sale vêm com zeros. Sales CANCELED não entram (AYD-005).
      operationId: getVendasPorMes
      parameters:
        - name: meses
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 12
          description: "Número de meses retrospectivos (1-60)"
      responses:
        "200":
          description: Dados de vendas por mês
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendasPorMesResponse"
        "400":
          description: Parâmetro `meses` inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/relatorios/servicos:
    get:
      tags:
        - Relatórios
      summary: Ranking dos serviços mais vendidos (AYD-010)
      description: "Retorna os 20 serviços com maior receita no período (só Items SERVICE; Sales canceladas fora). Mesmas regras de cálculo do ranking de produtos; o custo vem dos custos da venda ligados ao Item."
      operationId: getServicosMaisVendidos
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ranking de serviços
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicoRankingResponse"
        "400":
          description: Data inválida ou `from` > `to`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/relatorios/produtos:
    get:
      tags:
        - Relatórios
      summary: Ranking dos produtos mais vendidos
      description: "Retorna os 20 produtos com maior receita no período (só Items PRODUCT — serviços têm /relatorios/servicos). Sem filtro de data, considera todas as vendas."
      operationId: getProdutosMaisVendidos
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "Início inclusivo (YYYY-MM-DD). Vence `data_inicio` se ambos forem enviados (AYD-005)"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "Fim inclusivo (YYYY-MM-DD). Vence `data_fim` se ambos forem enviados (AYD-005)"
        - name: data_inicio
          in: query
          deprecated: true
          schema:
            type: string
            format: date
          description: "Legado — use `from`"
        - name: data_fim
          in: query
          deprecated: true
          schema:
            type: string
            format: date
          description: "Legado — use `to`"
      responses:
        "200":
          description: Ranking de produtos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoRankingResponse"
        "400":
          description: Data inválida ou `from` > `to`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Assistant connector (AYD-006): consentimento e Connections (Firebase + allowlist)
  # ============================================================
  /api/v1/oauth/authorization-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Assistant connector]
      summary: Dados do pedido de conexão (tela /conectar)
      description: |
        Só existe com `MCP_ENABLED=true`. 404 para pedido inexistente, expirado (10 min) ou já decidido.
      operationId: getAuthorizationRequest
      responses:
        "200":
          description: Pedido pendente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  client_name: {type: string}
                  redirect_host: {type: string, description: Host do redirect_uri, para o dono conferir}
                  scopes: {type: array, items: {type: string, enum: [read, write]}}
                  expires_at: {type: string, format: date-time}
        "404":
          description: pedido de conexão expirado; refaça pelo Claude

  /api/v1/oauth/authorization-requests/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Assistant connector]
      summary: Aprova o pedido (cria a Connection e o code de uso único)
      description: O corpo é ignorado (vazio ou `{}`).
      operationId: approveAuthorizationRequest
      responses:
        "200":
          description: URL para onde o web navega
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_to: {type: string, description: "redirect_uri?code=…&state=…"}
        "404": {description: inexistente ou expirado}
        "409": {description: já decidido}

  /api/v1/oauth/authorization-requests/{id}/deny:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Assistant connector]
      summary: Nega o pedido
      operationId: denyAuthorizationRequest
      responses:
        "200":
          description: "redirect_to = redirect_uri?error=access_denied&state=…"
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_to: {type: string}
        "404": {description: inexistente ou expirado}
        "409": {description: já decidido}

  /api/v1/oauth/connections:
    get:
      tags: [Assistant connector]
      summary: Lista as Connections ativas
      description: Só não revogadas e já ativadas; ordem `last_used_at` desc.
      operationId: listConnections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    client_name: {type: string}
                    scopes: {type: array, items: {type: string}}
                    created_at: {type: string, format: date-time}
                    last_used_at: {type: string, format: date-time, nullable: true}

  /api/v1/oauth/connections/{id}:
    delete:
      tags: [Assistant connector]
      summary: Revoga uma Connection
      operationId: revokeConnection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204": {description: Revogada}
        "404": {description: inexistente ou já revogada}

  # ============================================================
  # AYD-011 / SPEC-012 — fechamento da venda, busca e pendências
  # ============================================================
  /api/v1/quotes/{id}/convert:
    post:
      tags:
        - Quotes
      summary: Converte o Quote em Sale, com fechamento da venda opcional (AYD-011 C5)
      operationId: convertQuote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                closing:
                  $ref: "#/components/schemas/ClosingRequest"
      responses:
        "201":
          description: Sale criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
        "400":
          description: "closing inválido (com `field`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingErrorResponse"
        "404":
          description: Quote não encontrado
        "409":
          description: "Quote não OPEN, Σ parcelas ou entrada acima do preço (com `field`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingErrorResponse"
        "422":
          description: Quote sem Items
        "401":
          description: Não autenticado

  /api/v1/quotes/quick-sale:
    post:
      tags:
        - Quotes
      summary: Venda rápida (Quote + Sale num passo), com fechamento da venda opcional (AYD-011 C5)
      operationId: quickSale
      description: "Corpo do POST /quotes mais `closing` (Items apontados por `item_index`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, items]
              properties:
                customer_id: { type: string, format: uuid }
                referrer_id: { type: string, format: uuid, nullable: true }
                quote_date: { type: string, format: date }
                notes: { type: string, nullable: true }
                items: { type: array, items: { type: object } }
                charges: { type: array, items: { $ref: "#/components/schemas/SaleCharge" } }
                closing:
                  $ref: "#/components/schemas/ClosingRequest"
      responses:
        "201":
          description: Quote e Sale criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
        "400":
          description: "Payload ou closing inválido (com `field`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingErrorResponse"
        "409":
          description: "Σ parcelas ou entrada acima do preço (com `field`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/search:
    get:
      tags:
        - Busca
      summary: Busca global (AYD-011 C9)
      operationId: globalSearch
      description: |
        Casa nome (contém, sem acento nem caixa), telefone (CUSTOMER/SUPPLIER/PARTNER), número exato
        (QUOTE/SALE/PURCHASE, quando `q` é numérico — "98" ou "#98") e o nome do cliente/fornecedor das
        operações. Ordem no grupo: número exato, começa com `q`, contém; empate → mais recente.
        Exclui soft-deletados.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: types
          in: query
          schema: { type: string }
          description: "CSV de CUSTOMER, QUOTE, SALE, PURCHASE, PRODUCT, SERVICE, SUPPLIER, PARTNER (default: todos)"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
          description: "Por tipo"
      responses:
        "200":
          description: Grupos com resultado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: "q curto, types ou limit inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/pending-actions:
    get:
      tags:
        - Pendências
      summary: Pendências do dia (AYD-011 C10)
      operationId: listPendingActions
      description: |
        Calculado na leitura (nada gravado) com a mesma base de GET /obligations, /purchases/pending-sale-items
        e /stock/balance. Exclui Sales CANCELED e soft-deletados. Não substitui `GET /dashboard/notificacoes`.
      parameters:
        - name: horizon_days
          in: query
          schema: { type: integer, minimum: 0, maximum: 60, default: 7 }
      responses:
        "200":
          description: Grupos com count > 0, na ordem do enum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionsResponse"
        "400":
          description: horizon_days fora de 0..60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

