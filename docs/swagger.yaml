  # ============================================================
  # Pagamentos
  # ============================================================
  /api/v1/vendas/{id}/pagamentos:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Pagamentos
      summary: Lista pagamentos de uma venda
      description: "Retorna pagamentos ordenados: pendentes primeiro, depois por data."
      operationId: listPagamentos
      responses:
        "200":
          description: Lista de pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PagamentoResponse"
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Pagamentos
      summary: Registra um pagamento para uma venda
      description: |
        Lógica de status automático:
        - `data_agendada` fornecida → `status = pendente`
        - `data_pagamento` fornecida → `status = recebido`
        - Nenhuma data fornecida → `status = pendente`
        - `status = recebido` exige `payment_method` (400 se ausente)
        - Sale `CANCELED` → 409 `venda cancelada: recebimentos bloqueados` (vale para POST, PUT, confirmar e DELETE)
        
        **Regra:** `data_pagamento` e `data_agendada` são mutuamente exclusivos.
      operationId: createPagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoCreateRequest"
      responses:
        "201":
          description: Pagamento registrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagamentoResponse"
        "400":
          description: |
            Dados inválidos:
            - `valor` deve ser > 0
            - `payment_method` ausente (Receipt recebido) ou fora do enum
            - Não é permitido informar `data_pagamento` e `data_agendada` ao mesmo tempo
            - Formato de data inválido (esperado YYYY-MM-DD)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED: recebimentos bloqueados"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vendas/{id}/pagamentos/{pagId}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid
      - name: pagId
        in: path
        required: true
        description: UUID do pagamento
        schema:
          type: string
          format: uuid

    put:
      tags:
        - Pagamentos
      summary: Atualiza um pagamento
      operationId: updatePagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoUpdateRequest"
      responses:
        "200":
          description: Pagamento atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagamentoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Pagamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED: recebimentos bloqueados"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Pagamentos
      summary: Remove um pagamento (soft-delete)
      description: "Soft-delete (`deleted_at`, RN-08): o Receipt some de listas, totais, painel e alertas."
      operationId: deletePagamento
      responses:
        "204":
          description: Pagamento removido com sucesso
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Pagamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED: recebimentos bloqueados"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vendas/{id}/pagamentos/{pagId}/confirmar:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da venda
        schema:
          type: string
          format: uuid
      - name: pagId
        in: path
        required: true
        description: UUID do pagamento
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Pagamentos
      summary: Confirma o recebimento de um pagamento pendente
      description: |
        Altera o status do pagamento de `pendente` para `recebido`.
        Se `data_pagamento` não for fornecida no body, assume a data de hoje.
        `payment_method` é obrigatório (400), salvo se o Receipt já tiver um.
        Retorna 400 se o pagamento já estiver `recebido`.
      operationId: confirmarPagamento
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoConfirmarRequest"
      responses:
        "200":
          description: Pagamento confirmado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagamentoResponse"
        "400":
          description: Pagamento já confirmado ou data inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Pagamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Sale CANCELED: recebimentos bloqueados"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Purchases / Stock (AYD-002)
  # ============================================================
  /api/v1/purchases:
    get:
      tags:
        - Purchases
      summary: Lista Purchases (sem linhas)
      operationId: listPurchases
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/PurchaseKind"
          description: "Tipo"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PurchaseStatus"
          description: "Status"
        - name: payment_status
          in: query
          schema:
            $ref: "#/components/schemas/SupplierPaymentStatus"
          description: "Pagamento ao Supplier"
        - name: supplier_id
          in: query
          schema:
            type: string
            format: uuid
          description: "Supplier"
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: "Data de criação ≥ (fuso America/Sao_Paulo)"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: "Data de criação ≤"
      responses:
        "200":
          description: Purchases não excluídas, created_at desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseSummary"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    post:
      tags:
        - Purchases
      summary: Cria Purchase OPEN
      operationId: createPurchase
      description: |
        MADE_TO_ORDER: anexa `sale_item_ids` (mesmas regras de POST /purchases/{id}/sale-items).
        STOCK_REPLENISHMENT: cria as `items` (linhas de reposição).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCreateRequest"
      responses:
        "201":
          description: Purchase criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "400":
          description: "Payload inválido, fornecedor/produto inexistente, ou lista do outro tipo não vazia"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Item de Sale inexistente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Item de outro Supplier, já em outra Purchase, FROM_STOCK ou de Sale cancelada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/pending-sale-items:
    get:
      tags:
        - Purchases
      summary: Fila de Items a comprar por Supplier (RF-31)
      operationId: pendingSaleItems
      description: |
        Items MADE_TO_ORDER sem Purchase de Sales não canceladas/excluídas, agrupados por Supplier
        (por nome); o grupo sem Supplier (supplier_id null) vem por último.
      responses:
        "200":
          description: Grupos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSaleItemGroup"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Purchases
      summary: Detalhe da Purchase
      operationId: getPurchase
      responses:
        "200":
          description: Purchase + linhas + totais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    put:
      tags:
        - Purchases
      summary: Edita expected_date e notes
      operationId: updatePurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseUpdateRequest"
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    delete:
      tags:
        - Purchases
      summary: Soft-delete (só OPEN); libera os Items de Sale
      operationId: deletePurchase
      responses:
        "204":
          description: Excluída
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Purchase ≠ OPEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}/sale-items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Purchases
      summary: Anexa Items de Sale (só OPEN, kind MADE_TO_ORDER)
      operationId: attachSaleItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleItemIDsRequest"
      responses:
        "200":
          description: Purchase atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDetail"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Purchase ou Item inexistente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Purchase ≠ OPEN ou kind ≠ MADE_TO_ORDER; Item de outro Supplier/sem Supplier, já em outra Purchase, FROM_STOCK ou de Sale cancelada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}/sale-items/{saleItemId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: saleItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Purchases
      summary: Desanexa Item de Sale (só OPEN)
      operationId: detachSaleItem
      responses:
        "204":
          description: Desanexado (volta à fila)
        "404":
          description: "Purchase inexistente ou Item não está nela"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Purchase ≠ OPEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Purchases
      summary: Adiciona linha de reposição (só OPEN, kind STOCK_REPLENISHMENT)
      operationId: createPurchaseLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseLineRequest"
      responses:
        "201":
          description: Linha criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseLine"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Purchase ≠ OPEN ou kind ≠ STOCK_REPLENISHMENT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}/items/{itemId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Purchases
      summary: Edita linha de reposição (só OPEN)
      operationId: updatePurchaseLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseLineRequest"
      responses:
        "200":
          description: Linha atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseLine"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Purchase ≠ OPEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    delete:
      tags:
        - Purchases
      summary: Remove linha de reposição (só OPEN)
      operationId: deletePurchaseLine
      responses:
        "204":
          description: Removida
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Purchase ≠ OPEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Purchases
      summary: Transição de status
      operationId: updatePurchaseStatus
      description: |
        Só OPEN→ORDERED (carimba ordered_at), ORDERED→OPEN (limpa ordered_at) e ORDERED→RECEIVED
        (carimba received_at). RECEIVED é terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseStatusRequest"
      responses:
        "200":
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseStatusResponse"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Transição ilegal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Purchase sem linhas ao ir para ORDERED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/purchases/{id}/payment:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Purchases
      summary: Registra/desfaz o pagamento ao Supplier
      operationId: updatePurchasePayment
      description: |
        Um pagamento por Purchase; independe do status. PAID: paid_amount default = total_cost, paid_at default = hoje.
        PENDING: zera paid_amount e paid_at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasePaymentRequest"
      responses:
        "200":
          description: Pagamento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasePaymentResponse"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/stock/balance:
    get:
      tags:
        - Stock
      summary: Balance por Product
      operationId: listStockBalance
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: "Trecho do nome do Product"
        - name: only_negative
          in: query
          schema:
            type: boolean
          description: "Se true, só Balance < 0"
      responses:
        "200":
          description: Products não excluídos, por nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockBalance"
        "401":
          description: Não autenticado

  /api/v1/stock/balance/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Stock
      summary: Balance + extrato do Product
      operationId: getStockBalance
      responses:
        "200":
          description: Balance e movimentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBalanceDetail"
        "404":
          description: "Não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/stock/adjustments:
    get:
      tags:
        - Stock
      summary: Lista ajustes
      operationId: listStockAdjustments
      parameters:
        - name: product_id
          in: query
          schema:
            type: string
            format: uuid
          description: "Filtra por Product"
      responses:
        "200":
          description: adjusted_at desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAdjustment"
        "400":
          description: "Payload/parâmetro inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
    post:
      tags:
        - Stock
      summary: Cria ajuste manual (imutável)
      operationId: createStockAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentRequest"
      responses:
        "201":
          description: Ajuste criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustment"
        "400":
          description: "quantity = 0, reason inválido, produto inexistente ou data inválida"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado

  /api/v1/dashboard/resumo:
    get:
      tags:
        - Dashboard
      summary: Resumo financeiro do período
      description: |
        Retorna indicadores financeiros consolidados.
        Por padrão, o período é o mês corrente.
        `total_a_receber` e `vendas_abertas` ignoram o filtro de período (refletem o total global de não-ENTREGUE).
      operationId: getDashboardResumo
      parameters:
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
          description: "Início do período (padrão: primeiro dia do mês atual)"
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
          description: "Fim do período (padrão: hoje)"
      responses:
        "200":
          description: Resumo financeiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumoResponse"
        "400":
          description: Data inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/finance/summary:
    get:
      tags:
        - Financeiro
      summary: Painel financeiro (entra × sai) de um período
      description: |
        AYD-004. `sales` = visão por competência (Sales com `data_venda` no período, não CANCELED);
        `cash` = movimento datado no período (Receipts recebidos × pagamentos a Suppliers);
        `balances` = saldos em aberto hoje (ignoram o período). Default: do 1º dia do mês corrente até hoje.
      operationId: getFinanceSummary
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Painel financeiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummaryResponse"
        "400":
          description: "Data inválida ou from > to"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/notificacoes:
    get:
      tags:
        - Dashboard
      summary: Lista notificações não lidas
      description: |
        Retorna até 50 notificações não lidas. Pagamentos vencidos aparecem primeiro.
        Antes de ler, a API executa `gerar_notificacoes_pagamentos()` (idempotente; preserva
        `lida`) — sem `pg_cron` (AYD-004). Se a geração falhar, responde 500.
      operationId: getNotificacoes
      responses:
        "200":
          description: Lista de notificações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificacoesListResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/notificacoes/{id}/lida:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID da notificação
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Dashboard
      summary: Marca uma notificação como lida
      operationId: marcarNotificacaoLida
      responses:
        "204":
          description: Notificação marcada como lida
        "400":
          description: UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "404":
          description: Notificação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/notificacoes/marcar-todas-lidas:
    post:
      tags:
        - Dashboard
      summary: Marca todas as notificações como lidas
      operationId: marcarTodasNotificacoesLidas
      responses:
        "204":
          description: Todas as notificações marcadas como lidas
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/dashboard/gerar-notificacoes:
    post:
      tags:
        - Dashboard
      summary: Dispara a geração de notificações de pagamentos
      description: |
        Executa a função PostgreSQL `gerar_notificacoes_pagamentos()`.
        Já é executada a cada `GET /dashboard/notificacoes` (AYD-004); este endpoint só dispara a
        mesma geração sob demanda. A função é versionada na migração 007.
      operationId: gerarNotificacoes
      responses:
        "204":
          description: Notificações geradas com sucesso
        "401":
          description: Não autenticado
        "500":
          description: Erro ao executar função
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # Relatórios
  # ============================================================
  /api/v1/relatorios/vendas:
    get:
      tags:
        - Relatórios
      summary: Vendas e lucro por mês
      description: "Retorna dados agrupados por mês dos últimos N meses (padrão: 12, máx: 60)."
      operationId: getVendasPorMes
      parameters:
        - name: meses
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 12
          description: "Número de meses retrospectivos (1-60)"
      responses:
        "200":
          description: Dados de vendas por mês
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendasPorMesResponse"
        "400":
          description: Parâmetro `meses` inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/relatorios/produtos:
    get:
      tags:
        - Relatórios
      summary: Ranking dos produtos mais vendidos
      description: "Retorna os 20 produtos com maior receita no período. Sem filtro de data, considera todas as vendas."
      operationId: getProdutosMaisVendidos
      parameters:
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
          description: "Início do período (formato: YYYY-MM-DD)"
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
          description: "Fim do período (formato: YYYY-MM-DD)"
      responses:
        "200":
          description: Ranking de produtos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoRankingResponse"
        "400":
          description: Data inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

tags:
  - name: Health
    description: Verificação de disponibilidade da API (público)
  - name: Clientes
    description: Gerenciamento de clientes
  - name: Produtos
    description: Catálogo de produtos
  - name: Fornecedores
    description: Gerenciamento de fornecedores
  - name: Vendedores Externos
    description: Gerenciamento de vendedores externos (comissionados)
  - name: Vendas
    description: Gestão completa de vendas
  - name: Vendas / Itens
    description: Itens de uma venda
  - name: Pagamentos
    description: Pagamentos de clientes por venda
  - name: Purchases
    description: Compras consolidadas por Supplier e pagamento ao Supplier (AYD-002)
  - name: Stock
    description: Balance por Product, extrato e ajustes (AYD-002)
  - name: Financeiro
    description: Painel entra × sai por período e saldos em aberto (AYD-004)
  - name: Dashboard
    description: Indicadores financeiros e notificações
  - name: Relatórios
    description: Relatórios analíticos de vendas e produtos
