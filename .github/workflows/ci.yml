name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sales
          POSTGRES_PASSWORD: sales
          POSTGRES_DB: salesdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales -d salesdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sales:sales@localhost:5432/salesdb?sslmode=disable
      TEST_DATABASE_URL: postgres://sales:sales@localhost:5432/salesdb?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Migrations
        run: go run ./cmd/migrate up
      - name: Test
        run: go test -count=1 ./...
